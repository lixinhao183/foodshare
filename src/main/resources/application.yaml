server:
  port: 8080
  address: 0.0.0.0
spring:
  application:
    name: foodshare
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/foodshare?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      #password:
      database: 0
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: xinhao.foodshare.pojo.entity # 别名扫描包
  configuration:
    map-underscore-to-camel-case: true
file:
  upload:
    path: C:/Users/lixin/Desktop/foodshare_picture/
logging:
  level:
    "[xinhao.foodshare]": debug
